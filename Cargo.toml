[package]
name = "easy-jsonrpc-mwc"
description = """
Convert a trait definition into a jsonrpc api.
"""
repository = "https://github.com/mwcproject/easy-jsonrpc-mwc"
version = "0.5.7"
authors = ["Andrew Dirksen <andrew@dirksen.com>", "Yeastplume <yeastplume@protonmail.com>", "MWC Developers <info@mwc.mw>"]
license = "Apache-2.0"
documentation = "https://docs.rs/easy-jsonrpc"
edition = "2018"
readme = "readme.md"
keywords = ["json", "rpc", "macro", "client", "server"]

[dependencies]
easy-jsonrpc-proc-macro-mwc = { path = "./proc_macros", version = "0.5.3" }
serde_json = "1"
serde = "1"
jsonrpc-core = "18"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
warp = { version = "0.4", features = ["server"] }
